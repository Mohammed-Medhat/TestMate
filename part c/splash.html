<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestMate APR — Loading</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;600&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0e16;
      --panel: #111827;
      --border: #1e2d45;
      --accent: #3b82f6;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --green: #22c55e;
    }

    html,
    body {
      width: 480px;
      height: 320px;
      overflow: hidden;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      user-select: none;
      -webkit-app-region: drag;
      /* allow dragging the splash */
    }

    /* ── card ── */
    .card {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      position: relative;
      overflow: hidden;
    }

    /* animated grid background */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.35;
      animation: gridPan 8s linear infinite;
    }

    @keyframes gridPan {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 32px 32px;
      }
    }

    /* glow blob */
    .blob {
      position: absolute;
      width: 260px;
      height: 160px;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, .25) 0%, transparent 70%);
      pointer-events: none;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .6;
        transform: translateX(-50%) scaleY(1);
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) scaleY(1.15);
      }
    }

    /* ── header ── */
    .header {
      position: relative;
      text-align: center;
    }

    .logo-line {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── progress bar ── */
    .progress-wrap {
      position: relative;
      width: 320px;
    }

    .progress-track {
      height: 4px;
      background: var(--panel);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.4s ease;
      animation: shimmer 2s linear infinite;
      background-size: 200% 100%;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    /* ── status text ── */
    #status {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      min-height: 16px;
      transition: color 0.3s;
    }

    #status.ready {
      color: var(--green);
    }

    /* ── version badge ── */
    .badge {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="blob"></div>

    <div class="header">
      <div class="logo-line">
        <div class="dot"></div>
        <h1>TestMate APR</h1>
        <div class="dot"></div>
      </div>
      <div class="subtitle">Automated Program Repair</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-bar" id="bar"></div>
      </div>
    </div>

    <div id="status">Initialising…</div>

    <div class="badge">v1.0.0</div>
  </div>

  <script>
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");

    // Progress stages mapped to status messages
    const stages = {
      "Starting Python backend…": 15,
      "Waiting for Flask to be ready…": 50,
      "Loading TestMate…": 85,
    };

    // Listen for messages from Electron main process
    if (window.electronAPI) {
      window.electronAPI.onSplashStatus(msg => {
        status.textContent = msg;
        if (stages[msg] !== undefined) {
          bar.style.width = stages[msg] + "%";
        }
      });
    }

    // Fallback: animate the bar automatically so it never looks stuck
    let pct = 0;
    const tick = setInterval(() => {
      pct = Math.min(pct + 0.4, 80);
      if (parseFloat(bar.style.width) < pct) {
        bar.style.width = pct + "%";
      }
      if (pct >= 80) clearInterval(tick);
    }, 200);
  </script>
</body>

</html>
